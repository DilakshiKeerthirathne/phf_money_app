name: phf_money_app
description: PHF Offline Money Management App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  uuid: ^4.5.1
  intl: ^0.20.1
  fl_chart: ^0.70.2

  google_fonts: ^6.3.0
  flutter_animate: ^4.5.2
  flutter_launcher_icons: ^0.14.4

  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/phf_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  web: true
  image_path: "assets/icon/phf_icon.png"
  remove_alpha_ios: true
